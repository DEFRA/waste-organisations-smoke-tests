################################################################################
# Docker Compose file for starting up the service for testing in GitHub workflow
# This provides the infrastructure the waste-organisations service needs:
#   - mongodb
#   - postgres, with the schema applied by liquibase
#
# The service being tested is started here using the latest build from
# dockerhub. It has a .env config file in docker/config/
# Services can reference each other by their container names.
# e.g. http://waste-organisations:8080/
#
# The Postgres schema is the Liquibase changelog in the waste-organisations
# repository. Start the stack with `npm run stack:up`, which fetches the
# changelog first, or set WASTE_ORGANISATIONS_CHANGELOG to a changelog folder.
################################################################################
services:

################################################################################
  mongodb:
    image: mongo:7
    healthcheck:
      test: ["CMD", "mongosh", "--eval", "db.hello().ok"]
      interval: 5s
      start_period: 5s
      retries: 3

################################################################################
  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=waste_organisations
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d waste_organisations"]
      interval: 5s
      start_period: 5s
      retries: 10

################################################################################
# Applies the changelog to postgres once and exits; the service waits for it.
  liquibase:
    build:
      # The image has no PostgreSQL JDBC driver, so it is added here.
      dockerfile_inline: |
        FROM liquibase/liquibase:5.0.4
        RUN lpm add postgresql --global
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - LIQUIBASE_COMMAND_URL=jdbc:postgresql://postgres:5432/waste_organisations
      - LIQUIBASE_COMMAND_USERNAME=postgres
      - LIQUIBASE_COMMAND_PASSWORD=postgres
      - LIQUIBASE_COMMAND_CHANGELOG_FILE=db.changelog.xml
    volumes:
      - ${WASTE_ORGANISATIONS_CHANGELOG:-./.waste-organisations/changelog}:/liquibase/changelog
    command: update
    restart: "no"

################################################################################
#
# The service being tested.
#
################################################################################
  waste-organisations:
    image: defradigital/waste-organisations:${WASTE_ORGANISATIONS:-latest}
    # Always pull, so a stale local copy of the tag is never tested.
    pull_policy: always
    env_file:
      - ./docker/config/defaults.env
      - ./docker/config/waste-organisations.env
    environment:
      - PORT=8080
    depends_on:
      mongodb:
        condition: service_healthy
      liquibase:
        condition: service_completed_successfully
    ports:
      - 8080:8080
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 3s
      start_period: 5s
      retries: 10

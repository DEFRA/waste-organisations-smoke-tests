name: Run Journey Tests on GitHub

description: >
  Starts the waste-organisations service with docker compose and runs the smoke tests against it.
  This repository (waste-organisations-smoke-tests) must already be checked out; the service itself is pulled as a
  Docker image.

inputs:
  waste-organisations:
    description: Tag of the defradigital/waste-organisations image to test. Defaults to latest.
    required: false

runs:
  using: "composite"
  steps:
    - uses: actions/setup-node@v4
      with:
        node-version-file: .nvmrc
        cache: npm
    - name: Setup the tests
      run: npm ci
      shell: bash
    - name: Start docker compose
      shell: bash
      env:
        WASTE_ORGANISATIONS: ${{ inputs.waste-organisations }}
      run: npm run stack:up
    - name: Run the tests
      shell: bash
      run: npm run test:github
    - name: Generate the report
      if: always()
      shell: bash
      run: npm run report
    - name: debug
      if: always()
      run: |
        docker compose logs > logs.txt
        docker ps
      shell: bash
    - name: Upload allure report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: allure-report
        path: ./allure-report
    - name: Upload docker compose logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: docker-compose-logs
        path: ./logs.txt
